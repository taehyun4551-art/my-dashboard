<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영업 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --blue:#2563eb;
    --blue-soft:#dbe6fd;
    --blue-dark:#1e3a8a;
    --text:#111827;
    --sub:#6b7280;
    --line:#e5e7eb;
    --track:#f1f3f6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:#ffffff;color:var(--text);
    padding:28px 16px 48px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1200px;margin:0 auto}

  /* 상단 제목 */
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  h1{font-size:24px;font-weight:800;letter-spacing:-0.02em}
  .meta{font-size:13px;color:var(--sub)}
  .meta b{color:var(--blue);font-weight:700}

  .error{display:none;background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);
    border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:14px;line-height:1.6}

  /* 카드 4개 */
  .cards{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
  .label{font-size:13px;color:var(--sub);font-weight:600;margin-bottom:10px}
  .value{font-size:26px;font-weight:800;letter-spacing:-0.02em;line-height:1.2;word-break:keep-all}
  .card.main .value{font-size:36px;color:var(--blue)}
  .hint{font-size:13px;color:var(--sub);margin-top:8px}
  .hint b{color:var(--text);font-weight:700}
  .progress{height:10px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:14px}
  .progress div{height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .8s ease}
  .progress-row{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-top:8px}
  .progress-row b{color:var(--blue);font-weight:800}

  /* 패널 */
  .grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}
  .grid2.even{grid-template-columns:1fr 1fr}
  .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}
  .panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .panel h2{font-size:16px;font-weight:700}
  .legend{display:flex;gap:12px;font-size:12px;color:var(--sub);flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  .dash{width:16px;border-top:2px dashed #374151;display:inline-block}
  .empty{color:var(--sub);font-size:14px;padding:24px 0;text-align:center}

  #monthlyChart{width:100%}
  #monthlyChart svg{display:block}

  /* 깔때기 */
  .f-row{display:grid;grid-template-columns:76px 1fr;align-items:center;gap:10px}
  .f-name{font-size:13px;font-weight:600;color:var(--text);word-break:keep-all}
  .f-bar-wrap{display:flex;justify-content:center}
  .f-bar{height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;white-space:nowrap;transition:width .8s ease}
  .f-conv{display:grid;grid-template-columns:76px 1fr;gap:10px;font-size:12px;color:var(--sub);padding:5px 0}
  .f-conv span{text-align:center}
  .f-conv b{color:var(--blue);font-weight:700}
  .f-final{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
  .f-final .t{font-size:14px;font-weight:600}
  .f-final .t small{display:block;font-size:12px;color:var(--sub);font-weight:400;margin-top:2px}
  .f-final .v{font-size:28px;font-weight:800;color:var(--blue)}

  /* 순위 */
  .r-row{display:grid;grid-template-columns:26px minmax(60px,110px) 1fr auto;align-items:center;gap:10px;padding:8px 0}
  .r-no{width:24px;height:24px;border-radius:50%;background:var(--track);color:var(--sub);
    font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .r-no.top{background:var(--blue);color:#fff}
  .r-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r-track{height:10px;background:var(--track);border-radius:99px;overflow:hidden}
  .r-fill{height:100%;background:var(--blue-soft);border-radius:99px;transition:width .8s ease}
  .r-fill.top{background:var(--blue)}
  .r-amt{font-size:14px;font-weight:700;text-align:right;min-width:56px}

  /* 휴대폰 */
  @media (max-width:960px){
    .cards{grid-template-columns:1fr 1fr}
    .card.main{grid-column:1 / -1}
    .grid2,.grid2.even{grid-template-columns:1fr}
  }
  @media (max-width:520px){
    body{padding:20px 12px 40px}
    h1{font-size:20px}
    .cards{gap:10px}
    .card{padding:16px}
    .value{font-size:20px}
    .card.main .value{font-size:30px}
    .panel{padding:16px}
    .f-row,.f-conv{grid-template-columns:60px 1fr}
    .r-row{grid-template-columns:24px minmax(50px,80px) 1fr auto;gap:8px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>영업 대시보드</h1>
    <div class="meta" id="meta">불러오는 중…</div>
  </header>

  <div class="error" id="error"></div>

  <!-- 1. 카드 4개 -->
  <section class="cards">
    <div class="card main">
      <div class="label">이번 달 매출</div>
      <div class="value" id="cRevenue">—</div>
      <div class="progress"><div id="cBar"></div></div>
      <div class="progress-row"><span>목표 대비 달성률</span><b id="cRate">—</b></div>
    </div>
    <div class="card">
      <div class="label">이번 달 목표</div>
      <div class="value" id="cTarget">—</div>
      <div class="hint" id="cRemain">&nbsp;</div>
    </div>
    <div class="card">
      <div class="label">객단가</div>
      <div class="value" id="cAvg">—</div>
      <div class="hint">매출 ÷ 계약 건수</div>
    </div>
    <div class="card">
      <div class="label">계약 건수</div>
      <div class="value" id="cCount">—</div>
      <div class="hint" id="cStage">&nbsp;</div>
    </div>
  </section>

  <!-- 2, 3. 월별 매출 + 깔때기 -->
  <section class="grid2">
    <div class="panel">
      <div class="panel-head">
        <h2>월별 매출</h2>
        <div class="legend">
          <span><i class="dot" style="background:var(--blue-soft)"></i>매출</span>
          <span><i class="dot" style="background:var(--blue)"></i>이번 달</span>
          <span><i class="dash"></i>목표</span>
        </div>
      </div>
      <div id="monthlyChart"><div class="empty">불러오는 중…</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>영업 단계</h2></div>
      <div id="funnel"><div class="empty">불러오는 중…</div></div>
    </div>
  </section>

  <!-- 4, 5. 순위 -->
  <section class="grid2 even">
    <div class="panel">
      <div class="panel-head"><h2>담당자별 순위</h2></div>
      <div id="rankPerson"><div class="empty">불러오는 중…</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>상품별 순위</h2></div>
      <div id="rankProduct"><div class="empty">불러오는 중…</div></div>
    </div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://ydchjbyhdlzuwmoeacgg.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlkY2hqYnloZGx6dXdtb2VhY2dnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MjcwNzEsImV4cCI6MjEwNjUwMzA3MX0.ISxwpXTLepBXbAg4wg5578aNkVEBGAIbKgVGKFBCclE';

  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_KEY);

  let monthlyRows = [];

  /* ---------- 숫자 표시 도우미 ---------- */
  const num = v => Number(v) || 0;
  const won = n => Math.round(n).toLocaleString('ko-KR') + '원';
  const pct = (a, b) => b ? (a / b * 100).toFixed(1) + '%' : '—';
  function short(n){
    const a = Math.abs(n);
    if (a >= 1e8) return (n / 1e8).toFixed(1).replace(/\.0$/, '') + '억';
    if (a >= 1e4) return Math.round(n / 1e4).toLocaleString('ko-KR') + '만';
    return Math.round(n).toLocaleString('ko-KR');
  }
  function esc(s){
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function niceMax(v){
    if (v <= 0) return 1;
    const m = v * 1.1;
    const p = Math.pow(10, Math.floor(Math.log10(m)));
    return Math.ceil(m / p * 2) / 2 * p;
  }
  const $ = id => document.getElementById(id);

  /* ---------- 1. 카드 ---------- */
  function drawCards(monthly, pipeline){
    const cur = monthly[monthly.length - 1];
    const last = pipeline[pipeline.length - 1];
    const revenue = cur ? num(cur.revenue) : 0;
    const target = cur ? num(cur.target) : 0;
    const count = last ? num(last.count) : 0;

    $('cRevenue').textContent = cur ? won(revenue) : '—';
    $('cRate').textContent = pct(revenue, target);
    $('cBar').style.width = target ? Math.min(revenue / target * 100, 100) + '%' : '0';

    $('cTarget').textContent = cur ? won(target) : '—';
    const remain = target - revenue;
    $('cRemain').innerHTML = !cur ? '&nbsp;'
      : remain > 0 ? '남은 금액 <b>' + won(remain) + '</b>'
      : '목표 초과 <b>+' + won(-remain) + '</b>';

    $('cAvg').textContent = count ? won(revenue / count) : '—';
    $('cCount').textContent = last ? count.toLocaleString('ko-KR') + '건' : '—';
    $('cStage').textContent = last ? '단계: ' + last.stage : '';

    $('meta').innerHTML = cur
      ? '기준 <b>' + esc(cur.month) + '</b> · ' + new Date().toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'}) + ' 업데이트'
      : '데이터 없음';
  }

  /* ---------- 2. 월별 매출 막대그래프 (SVG) ---------- */
  function drawMonthly(){
    const box = $('monthlyChart');
    const rows = monthlyRows;
    if (!rows.length){ box.innerHTML = '<div class="empty">데이터가 없습니다</div>'; return; }

    const W = Math.max(box.clientWidth, 260);
    const small = W < 500;
    const H = small ? 240 : 300;
    const pl = small ? 40 : 52, pr = 8, pt = 26, pb = 30;
    const iw = W - pl - pr, ih = H - pt - pb;
    const max = niceMax(Math.max(...rows.map(r => Math.max(num(r.revenue), num(r.target)))));
    const n = rows.length, slot = iw / n;
    const bw = Math.min(slot * 0.58, 48);
    const yOf = v => pt + ih - ih * v / max;
    const fs = small ? 11 : 12;
    const every = slot < 30 ? Math.ceil(30 / slot) : 1;

    let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Pretendard, sans-serif">`;

    // 눈금선
    for (let i = 0; i <= 4; i++){
      const v = max * i / 4, y = yOf(v);
      s += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="${i ? '#f1f3f6' : '#e5e7eb'}"/>`;
      s += `<text x="${pl - 8}" y="${y + 4}" text-anchor="end" font-size="${fs}" fill="#9ca3af">${short(v)}</text>`;
    }

    // 막대
    rows.forEach((r, i) => {
      const v = num(r.revenue);
      const isCur = i === n - 1;
      const x = pl + slot * i + (slot - bw) / 2;
      const y = yOf(v), h = pt + ih - y;
      s += `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(h, 0)}" rx="4" fill="${isCur ? '#2563eb' : '#dbe6fd'}">`
         + `<title>${esc(r.month)} 매출 ${won(v)} / 목표 ${won(num(r.target))}</title></rect>`;
      if (isCur){
        s += `<text x="${x + bw / 2}" y="${y - 8}" text-anchor="middle" font-size="${fs}" font-weight="700" fill="#2563eb">${short(v)}</text>`;
      }
      if (i % every === 0 || isCur){
        s += `<text x="${pl + slot * i + slot / 2}" y="${H - 10}" text-anchor="middle" font-size="${fs}" fill="${isCur ? '#2563eb' : '#6b7280'}" font-weight="${isCur ? 700 : 400}">${esc(r.month)}</text>`;
      }
    });

    // 목표 점선 (월마다 목표가 다르면 계단 모양)
    let d = '';
    rows.forEach((r, i) => {
      const y = yOf(num(r.target));
      const x1 = pl + slot * i, x2 = pl + slot * (i + 1);
      d += (i === 0 ? `M${x1} ${y}` : ` V${y}`) + ` H${x2}`;
    });
    s += `<path d="${d}" fill="none" stroke="#374151" stroke-width="1.6" stroke-dasharray="5 4"/>`;

    s += '</svg>';
    box.innerHTML = s;
  }

  /* ---------- 3. 영업 단계 깔때기 ---------- */
  function drawFunnel(rows){
    const box = $('funnel');
    if (!rows.length){ box.innerHTML = '<div class="empty">데이터가 없습니다</div>'; return; }

    const first = num(rows[0].count);
    const n = rows.length;
    let h = '';
    rows.forEach((r, i) => {
      const c = num(r.count);
      if (i > 0){
        h += `<div class="f-conv"><i></i><span>↓ 전환율 <b>${pct(c, num(rows[i - 1].count))}</b></span></div>`;
      }
      const w = first ? Math.max(c / first * 100, 26) : 100;
      // 위 단계일수록 연하게, 마지막(계약) 단계가 가장 진하게
      const a = n > 1 ? 0.25 + 0.75 * (i / (n - 1)) : 1;
      const color = a >= 0.6 ? '#ffffff' : '#1e3a8a';
      h += `<div class="f-row">
              <div class="f-name">${esc(r.stage)}</div>
              <div class="f-bar-wrap">
                <div class="f-bar" style="width:${w}%;background:rgba(37,99,235,${a.toFixed(2)});color:${color}">${c.toLocaleString('ko-KR')}</div>
              </div>
            </div>`;
    });
    const last = num(rows[n - 1].count);
    h += `<div class="f-final">
            <div class="t">최종 전환율<small>${esc(rows[n - 1].stage)} ÷ ${esc(rows[0].stage)}</small></div>
            <div class="v">${pct(last, first)}</div>
          </div>`;
    box.innerHTML = h;
  }

  /* ---------- 4, 5. 순위 ---------- */
  function drawRank(id, list){
    const box = $(id);
    if (!list.length){ box.innerHTML = '<div class="empty">데이터가 없습니다</div>'; return; }
    list.sort((a, b) => num(b.amount) - num(a.amount));
    const max = num(list[0].amount) || 1;
    box.innerHTML = list.map((r, i) => `
      <div class="r-row" title="${esc(r.name)} ${won(num(r.amount))}">
        <span class="r-no ${i === 0 ? 'top' : ''}">${i + 1}</span>
        <span class="r-name">${esc(r.name)}</span>
        <div class="r-track"><div class="r-fill ${i === 0 ? 'top' : ''}" style="width:${Math.max(num(r.amount) / max * 100, 2)}%"></div></div>
        <span class="r-amt">${short(num(r.amount))}</span>
      </div>`).join('');
  }

  /* ---------- 데이터 불러오기 ---------- */
  async function load(){
    try {
      const [m, p, r] = await Promise.all([
        db.from('sales_monthly').select('*').order('sort_order', { ascending: true }),
        db.from('sales_pipeline').select('*').order('sort_order', { ascending: true }),
        db.from('sales_rank').select('*')
      ]);
      if (m.error) throw m.error;
      if (p.error) throw p.error;
      if (r.error) throw r.error;

      monthlyRows = m.data || [];
      const pipeline = p.data || [];
      const rank = r.data || [];

      drawCards(monthlyRows, pipeline);
      drawMonthly();
      drawFunnel(pipeline);
      drawRank('rankPerson', rank.filter(x => x.kind === 'person'));
      drawRank('rankProduct', rank.filter(x => x.kind === 'product'));
    } catch (e) {
      $('meta').textContent = '불러오기 실패';
      const box = $('error');
      box.style.display = 'block';
      box.innerHTML = '<b>데이터를 불러오지 못했습니다.</b><br>' + esc(e.message || e)
        + '<br><span style="color:#6b7280">Supabase 테이블 이름, RLS(읽기 권한) 설정을 확인해 주세요.</span>';
      ['monthlyChart', 'funnel', 'rankPerson', 'rankProduct'].forEach(id => $(id).innerHTML = '<div class="empty">—</div>');
    }
  }

  // 화면 크기가 바뀌면 막대그래프 다시 그리기
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(drawMonthly, 150);
  });

  load();
</script>
</body>
</html>
